[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
optimizer = true
optimizer_runs = 1000
via_ir = true

# Read-only access to the generated on-chain data (SVGs + token->traits table)
# for the upload script and the real-data tests.
fs_permissions = [{ access = "read", path = "./onchain-data" }]
